plugins {
    id 'com.android.application'
}

def webRoot = file("${rootProject.projectDir}/../web")

tasks.register('syncWebAssets', Copy) {
    group = 'build'
    description = 'Copy web/ frontend into Android assets'
    from(webRoot)
    into 'src/main/assets'
    include 'index.html'
    include 'css/**'
    include 'js/**'
    include 'fonts/**'
}

android {
    namespace 'com.kuromi.checkin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.kuromi.checkin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild').configure {
    dependsOn 'syncWebAssets'
}
